[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "france-messagerie-rag-demo"
version = "0.1.0"
description = "Démonstrateur RAG local pour France Messagerie"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6,<7",
    "PyMuPDF>=1.24,<2",
    "requests>=2.31,<3",
    "tenacity>=8.2,<10",
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<1",
    "streamlit>=1.37,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]